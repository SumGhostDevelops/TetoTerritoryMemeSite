<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teto Territory </title>
  <style>
    :root { --bg: #622530; --fg: #CE445B; --accent: #DF8A9C; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background-color: var(--bg);
      background-image: url("tetobg.gif");
      background-repeat: repeat;
      background-size: 180px auto;
      color: var(--fg);
      font-family: "Roboto", sans-serif;
      display: grid;
      place-items: center;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }

  
    .stage { perspective: 800px; }

    #hero {
      display: block;
      width: min(80vw, 420px);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
      transition: transform .15s ease-out;
      will-change: transform;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <div class="stage">
   
    <img id="hero" src="tetodancing.gif" alt="Hover Teto">
  </div>

  <audio id="music" src="Tetoterritory.mp3" loop></audio>

  <script>
    const hero = document.getElementById('hero');
    const MAX_TILT = 15;   
    const MAX_SHIFT = 20;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    hero.addEventListener('pointermove', (e) => {
      if (reduceMotion) return;
      const box = hero.getBoundingClientRect();
    
      const x = ((e.clientX - box.left) / box.width - 0.5) * 2;
      const y = ((e.clientY - box.top) / box.height - 0.5) * 2;

      hero.style.transform =
        `translate(${x * MAX_SHIFT}px, ${y * MAX_SHIFT}px) ` +
        `rotateY(${x * MAX_TILT}deg) rotateX(${-y * MAX_TILT}deg)`;
    });

    hero.addEventListener('pointerleave', () => {
      hero.style.transform = '';
    });

   
    const music = document.getElementById('music');

  
    music.play().catch(() => {
      const events = ['pointerdown', 'keydown', 'touchstart'];
      const start = () => {
        music.play();
        events.forEach(ev => document.removeEventListener(ev, start));
      };
      events.forEach(ev => document.addEventListener(ev, start));
    });
  </script>
</body>
</html>
